name: Database access proposal
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/database-access/**'
      - '.github/workflows/database-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/database-access/package-lock.json
      - run: npm ci --prefix tests/database-access
      - run: node tests/database-access/run.mjs
