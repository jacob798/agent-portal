name: Design catalogue
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run tokens:build && npm run tokens:check
      - run: git diff --exit-code -- design/generated
      - run: npx tsc --noEmit
      - run: npx eslint .storybook stories scripts tests/design playwright.design.config.ts
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:design
